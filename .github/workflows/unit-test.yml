name: Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:ci

  algo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Show toolchain versions
        run: |
          g++-14 --version
          cmake --version

      - name: Enable vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Export vcpkg binary sources
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure (vcpkg manifest + gtest)
        working-directory: cpp/tests
        run: cmake --preset release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build unit tests
        working-directory: cpp/tests
        run: cmake --build build-release

      - name: Run unit tests (ctest)
        working-directory: cpp/tests
        run: ctest --test-dir build-release --output-on-failure